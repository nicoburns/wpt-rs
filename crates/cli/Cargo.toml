[package]
name = "wpt"
description = "CLI for working with WPT data"
version.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["zstd", "xz2", "jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]
zstd = ["dep:zstd"]
xz2 = ["dep:xz2"]

[dependencies]
# Workspace dependecies
wpt_report = { workspace = true }
wpt_manifest = { workspace = true }

# 3rd-party dependencies
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-jsonlines = { workspace = true }
zstd = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "cargo"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
