[package]
name = "wptmanifest"
description = "Generate the web-platform-tests MANIFEST.json"
version.workspace = true
repository.workspace = true
license = "BSD-3-Clause"
edition.workspace = true
# html5ever/xml5ever 0.40 need 1.85 and ignore 0.4.32 needs 1.88
rust-version = "1.88"

[dependencies]
encoding_rs = "0.8"
html5ever = "0.40"
xml5ever = "0.40"
ignore = "0.4"
rayon = { workspace = true }
saphyr = "0.0.6"
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10"
